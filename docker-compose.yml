name: infra-incident-ai

services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Infra Incident AI}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8088}
      ENABLE_OLLAMA: ${ENABLE_OLLAMA:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:35b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-20}
      CALLCENTER_BASE_URL: ${CALLCENTER_BASE_URL:-}
      CALLCENTER_API_TOKEN: ${CALLCENTER_API_TOKEN:-}
      KENCE_BASE_URL: ${KENCE_BASE_URL:-}
      KENCE_API_TOKEN: ${KENCE_API_TOKEN:-}
      KENCE_SESSION_ID: ${KENCE_SESSION_ID:-}
      KENCE_TIMEOUT_SECONDS: ${KENCE_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=4m,mode=0755
    restart: unless-stopped
